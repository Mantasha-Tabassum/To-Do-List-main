<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Register</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->

            <div class="auth-logo">
                ✓
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your TaskFlow account
            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">

                <div class="auth-field">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>

            </form>


            <!-- MESSAGE -->

            <p
                id="registerMessage"
                class="auth-message"
            ></p>


            <!-- LOGIN LINK -->

            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
